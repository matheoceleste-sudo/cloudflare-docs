<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aperçu — 3 logos lion</title>
<style>
  body{margin:0;font-family:system-ui,sans-serif;background:#0f0f12;color:#eee;padding:32px}
  h1{font-size:20px;font-weight:600;text-align:center;margin:0 0 28px}
  .grid{display:grid;gap:24px;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));max-width:900px;margin:0 auto}
  .card{background:#1a1a1f;border:1px solid #2a2a30;border-radius:16px;padding:20px;text-align:center}
  .card img{width:100%;max-width:200px;height:auto}
  .name{margin-top:14px;font-size:14px;color:#aaa}
  .num{color:#F6A623;font-weight:700}
</style>
</head>
<body>
  <h1>🦁 Trois propositions de logo</h1>
  <div class="grid">
    <div class="card"><img src="lion-01-tete-geometrique.svg" alt="Tête géométrique"><div class="name"><span class="num">1.</span> Tête géométrique</div></div>
    <div class="card"><img src="lion-02-patte.svg" alt="Empreinte de patte"><div class="name"><span class="num">2.</span> Empreinte de patte</div></div>
    <div class="card"><img src="lion-03-silhouette-badge.svg" alt="Silhouette écusson"><div class="name"><span class="num">3.</span> Silhouette en écusson</div></div>
  </div>
</body>
</html>
