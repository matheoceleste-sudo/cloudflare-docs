<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" width="320" height="320" role="img" aria-label="Logo lion réaliste ombragé">
  <defs>
    <radialGradient id="bg" cx="50%" cy="42%" r="70%">
      <stop offset="0" stop-color="#2b2620"/>
      <stop offset="1" stop-color="#0e0c0a"/>
    </radialGradient>
    <linearGradient id="maneOuter" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8a4b12"/>
      <stop offset="0.5" stop-color="#b96c1c"/>
      <stop offset="1" stop-color="#5e3210"/>
    </linearGradient>
    <linearGradient id="maneInner" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e39a3a"/>
      <stop offset="1" stop-color="#a75f18"/>
    </linearGradient>
    <radialGradient id="face" cx="50%" cy="40%" r="65%">
      <stop offset="0" stop-color="#f4c876"/>
      <stop offset="0.6" stop-color="#e0a24c"/>
      <stop offset="1" stop-color="#b97a2c"/>
    </radialGradient>
    <radialGradient id="muzzle" cx="50%" cy="35%" r="70%">
      <stop offset="0" stop-color="#fbe9c8"/>
      <stop offset="1" stop-color="#e6c48d"/>
    </radialGradient>
    <radialGradient id="eye" cx="50%" cy="40%" r="60%">
      <stop offset="0" stop-color="#ffe08a"/>
      <stop offset="0.7" stop-color="#c8890f"/>
      <stop offset="1" stop-color="#6e4708"/>
    </radialGradient>
  </defs>

  <circle cx="160" cy="160" r="156" fill="url(#bg)"/>

  <!-- CRINIÈRE : deux couches de mèches -->
  <g>
    <!-- couche externe sombre -->
    <g fill="url(#maneOuter)" stroke="#3d2109" stroke-width="1.5">
      <path d="M160 24
               C120 26 92 40 74 66 C52 60 34 74 30 96 C10 100 6 128 22 146
               C4 158 6 190 28 200 C16 220 28 252 52 256 C54 282 84 298 112 288
               C122 306 158 312 160 312 C162 312 198 306 208 288
               C236 298 266 282 268 256 C292 252 304 220 292 200
               C314 190 316 158 298 146 C314 128 310 100 290 96
               C286 74 268 60 246 66 C228 40 200 26 160 24 Z"/>
    </g>
    <!-- pointes de mèches externes -->
    <g fill="url(#maneOuter)">
      <path d="M160 18 l14 26 -28 0 Z"/>
      <path d="M96 34 l6 30 -26 -14 Z"/>
      <path d="M224 34 l-6 30 26 -14 Z"/>
      <path d="M40 88 l30 6 -22 22 Z"/>
      <path d="M280 88 l-30 6 22 22 Z"/>
      <path d="M20 160 l30 -8 0 26 Z"/>
      <path d="M300 160 l-30 -8 0 26 Z"/>
      <path d="M40 232 l28 -14 6 28 Z"/>
      <path d="M280 232 l-28 -14 -6 28 Z"/>
      <path d="M96 292 l10 -28 20 16 Z"/>
      <path d="M224 292 l-10 -28 -20 16 Z"/>
      <path d="M160 306 l-16 -28 32 0 Z"/>
    </g>
    <!-- couche interne claire -->
    <g fill="url(#maneInner)">
      <path d="M160 44
               C128 46 104 58 90 80 C70 78 56 92 54 112 C40 118 40 142 54 152
               C42 164 46 190 66 196 C60 216 78 236 98 232 C102 252 130 262 160 260
               C190 262 218 252 222 232 C242 236 260 216 254 196
               C274 190 278 164 266 152 C280 142 280 118 266 112
               C264 92 250 78 230 80 C216 58 192 46 160 44 Z"/>
    </g>
  </g>

  <!-- OREILLES -->
  <g>
    <ellipse cx="108" cy="86" rx="18" ry="22" transform="rotate(-24 108 86)" fill="url(#maneInner)" stroke="#8a4b12" stroke-width="2"/>
    <ellipse cx="212" cy="86" rx="18" ry="22" transform="rotate(24 212 86)" fill="url(#maneInner)" stroke="#8a4b12" stroke-width="2"/>
    <ellipse cx="108" cy="88" rx="9" ry="12" transform="rotate(-24 108 88)" fill="#7a4a20"/>
    <ellipse cx="212" cy="88" rx="9" ry="12" transform="rotate(24 212 88)" fill="#7a4a20"/>
  </g>

  <!-- VISAGE -->
  <path d="M160 92
           C118 92 96 122 96 160
           C96 196 118 222 160 236
           C202 222 224 196 224 160
           C224 122 202 92 160 92 Z" fill="url(#face)"/>
  <!-- ombrage joues -->
  <path d="M104 150 C100 178 116 206 150 224 C122 210 108 184 108 158 Z" fill="#00000022"/>
  <path d="M216 150 C220 178 204 206 170 224 C198 210 212 184 212 158 Z" fill="#00000022"/>

  <!-- front : ligne en M -->
  <path d="M132 118 Q160 104 188 118" fill="none" stroke="#a86a24" stroke-width="4" stroke-linecap="round"/>
  <path d="M160 108 L160 128" stroke="#a86a24" stroke-width="3" stroke-linecap="round"/>

  <!-- YEUX -->
  <g>
    <path d="M118 148 Q134 136 150 148 Q134 158 118 148 Z" fill="#fff8e6"/>
    <path d="M170 148 Q186 136 202 148 Q186 158 170 148 Z" fill="#fff8e6"/>
    <circle cx="134" cy="148" r="8.5" fill="url(#eye)"/>
    <circle cx="186" cy="148" r="8.5" fill="url(#eye)"/>
    <circle cx="134" cy="148" r="3.4" fill="#160d02"/>
    <circle cx="186" cy="148" r="3.4" fill="#160d02"/>
    <circle cx="136.4" cy="145.6" r="1.4" fill="#fff"/>
    <circle cx="188.4" cy="145.6" r="1.4" fill="#fff"/>
    <!-- sourcils / contour -->
    <path d="M116 142 Q134 130 152 140" fill="none" stroke="#6e4712" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M168 140 Q186 130 204 142" fill="none" stroke="#6e4712" stroke-width="3.5" stroke-linecap="round"/>
  </g>

  <!-- MUSEAU -->
  <path d="M132 176 Q160 168 188 176 Q196 196 176 210 Q160 218 144 210 Q124 196 132 176 Z" fill="url(#muzzle)"/>
  <!-- truffe -->
  <path d="M146 182 Q160 176 174 182 Q176 194 160 200 Q144 194 146 182 Z" fill="#3a2417"/>
  <path d="M160 200 L160 210" stroke="#3a2417" stroke-width="3" stroke-linecap="round"/>
  <!-- bouche -->
  <path d="M160 210 Q142 220 128 210" fill="none" stroke="#5a3a1c" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M160 210 Q178 220 192 210" fill="none" stroke="#5a3a1c" stroke-width="3.5" stroke-linecap="round"/>
  <!-- points de moustaches -->
  <g fill="#8a5a2e">
    <circle cx="138" cy="192" r="1.4"/><circle cx="132" cy="198" r="1.4"/><circle cx="140" cy="200" r="1.4"/>
    <circle cx="182" cy="192" r="1.4"/><circle cx="188" cy="198" r="1.4"/><circle cx="180" cy="200" r="1.4"/>
  </g>
  <!-- moustaches -->
  <g stroke="#fbeecf" stroke-width="1.4" stroke-linecap="round" opacity="0.85">
    <path d="M136 194 Q108 190 86 196"/>
    <path d="M136 200 Q110 202 90 210"/>
    <path d="M184 194 Q212 190 234 196"/>
    <path d="M184 200 Q210 202 230 210"/>
  </g>
</svg>
