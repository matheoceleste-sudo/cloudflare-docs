<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<title>Mathclean — Flyer animé</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Jost:wght@200;300;400;500&display=swap" rel="stylesheet" />
<style>
  :root{
    --navy:#0e2033;
    --ink:#0a1826;
    --gold:#c2a36b;
    --gold-soft:#d8c096;
    --paper:#f6f3ec;
    --mist:#a9b6c2;
    --line:rgba(194,163,107,.30);
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{width:1080px; height:1080px; overflow:hidden;}
  body{
    font-family:'Jost', sans-serif; font-weight:300;
    color:var(--paper); position:relative;
    background: linear-gradient(170deg, #12283e 0%, var(--navy) 55%, var(--ink) 100%);
  }

  /* halo lumineux qui respire */
  .halo{
    position:absolute; top:-15%; left:50%; transform:translateX(-50%);
    width:900px; height:900px; border-radius:50%;
    background: radial-gradient(circle, rgba(194,163,107,.12) 0%, transparent 62%);
    animation: breathe 7s ease-in-out infinite;
  }
  @keyframes breathe{ 0%,100%{ opacity:.6; transform:translateX(-50%) scale(1); } 50%{ opacity:1; transform:translateX(-50%) scale(1.08); } }

  /* fines particules */
  .particle{
    position:absolute; bottom:-10px; width:3px; height:3px; border-radius:50%;
    background:var(--gold-soft); opacity:0;
    box-shadow:0 0 8px 1px rgba(216,192,150,.5);
    animation: rise 9s linear infinite;
  }
  @keyframes rise{ 0%{ transform:translateY(0); opacity:0; } 12%{ opacity:.7; } 88%{ opacity:.3; } 100%{ transform:translateY(-1040px); opacity:0; } }

  .frame{ position:absolute; inset:46px; border:1px solid var(--line); opacity:0; animation:fade 1.2s ease-out .1s forwards; }

  .content{
    position:relative; z-index:2; height:100%;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center; padding:0 110px;
  }

  .eyebrow{
    font-size:15px; letter-spacing:.6em; text-transform:uppercase; color:var(--mist); font-weight:300; padding-left:.6em;
    opacity:0; transform:translateY(12px); animation:reveal .8s cubic-bezier(.16,.9,.28,1) .3s forwards;
  }
  .brand{
    margin-top:26px;
    font-family:'Cormorant Garamond', serif; font-weight:500;
    font-size:128px; line-height:.9; letter-spacing:.02em; color:var(--gold-soft);
    opacity:0; transform:translateY(20px); animation:reveal .9s cubic-bezier(.16,.9,.28,1) .55s forwards;
  }
  .slogan{
    margin-top:28px;
    font-family:'Cormorant Garamond', serif; font-style:italic; font-weight:400;
    font-size:37px; opacity:.92;
    opacity:0; transform:translateY(12px); animation:reveal .8s cubic-bezier(.16,.9,.28,1) .95s forwards;
  }
  .top-rule{
    margin:44px 0 4px; height:1px; width:0; background:var(--gold); opacity:.7;
    animation:grow 1s ease-out 1.4s forwards;
  }
  @keyframes grow{ to{ width:72px; } }

  .services{
    margin-top:44px; display:flex; gap:70px; justify-content:center;
  }
  .service{
    opacity:0; transform:translateY(16px);
    animation:reveal .7s cubic-bezier(.16,.9,.28,1) forwards;
  }
  .service:nth-child(1){ animation-delay:1.7s; }
  .service:nth-child(2){ animation-delay:1.88s; }
  .service:nth-child(3){ animation-delay:2.06s; }
  .service .ico{ width:52px; height:52px; margin:0 auto 16px; display:flex; align-items:center; justify-content:center; }
  .service .ico svg{ width:42px; height:42px; stroke:var(--gold); }
  .service h3{ font-family:'Cormorant Garamond', serif; font-weight:500; font-size:24px; color:var(--paper); }

  .zone{
    margin-top:56px;
    opacity:0; animation:reveal .8s ease-out 2.35s forwards;
  }
  .zone .tag{ font-size:12px; letter-spacing:.42em; text-transform:uppercase; color:var(--gold); }
  .zone p{ margin-top:12px; font-size:18px; color:var(--paper); opacity:.9; }

  .contact{
    margin-top:44px; display:flex; gap:44px; align-items:center;
    opacity:0; animation:reveal .8s ease-out 2.6s forwards;
  }
  .contact-item{ display:flex; align-items:center; gap:11px; font-size:18px; font-weight:300; }
  .contact-item svg{ width:18px; height:18px; stroke:var(--gold); }

  .site{
    margin-top:40px;
    font-family:'Cormorant Garamond', serif; font-style:italic; font-weight:500;
    font-size:30px; color:var(--gold-soft);
    opacity:0; animation:reveal .8s ease-out 2.85s forwards, sheen 4s ease-in-out 3.6s infinite;
  }
  @keyframes sheen{ 0%,100%{ opacity:1; } 50%{ opacity:.72; } }

  @keyframes reveal{ to{ opacity:1; transform:translateY(0); } }
  @keyframes fade{ to{ opacity:1; } }
</style>
</head>
<body>
  <div class="halo"></div>
  <div class="particle" style="left:16%; animation-delay:0s;"></div>
  <div class="particle" style="left:34%; animation-delay:2.2s;"></div>
  <div class="particle" style="left:58%; animation-delay:4s;"></div>
  <div class="particle" style="left:78%; animation-delay:1.2s;"></div>
  <div class="particle" style="left:90%; animation-delay:5.4s;"></div>
  <div class="frame"></div>

  <div class="content">
    <span class="eyebrow">Nettoyage haut de gamme</span>
    <div class="brand">Mathclean</div>
    <p class="slogan">L'art du nettoyage à Paris</p>
    <div class="top-rule"></div>

    <div class="services">
      <div class="service">
        <div class="ico"><svg viewBox="0 0 24 24" fill="none" stroke-width="1"><path d="M6 3v6a6 6 0 0 0 12 0V3M4 21h16"/></svg></div>
        <h3>Particuliers &amp; Pro</h3>
      </div>
      <div class="service">
        <div class="ico"><svg viewBox="0 0 24 24" fill="none" stroke-width="1"><path d="M3 18c1.5 1.2 3 1.2 4.5 0s3-1.2 4.5 0 3 1.2 4.5 0 3-1.2 4.5 0M5 14l1-6h12l1 6M9 8V5h6v3"/></svg></div>
        <h3>Bateaux</h3>
      </div>
      <div class="service">
        <div class="ico"><svg viewBox="0 0 24 24" fill="none" stroke-width="1"><path d="M2 16l7-2 5-8c.6-1 2-1 2.3.2l1 6.8 4-1a2 2 0 0 1 2 3l-6 3-16 1-1.3-2Z"/><path d="M9 20h9"/></svg></div>
        <h3>Jets privés</h3>
      </div>
    </div>

    <div class="zone">
      <span class="tag">Zone d'intervention</span>
      <p>Paris &amp; alentours — déplacement dans toute la France</p>
    </div>

    <div class="contact">
      <div class="contact-item">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="1.4"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1 1 .4 2 .7 2.9a2 2 0 0 1-.5 2.1L8 10a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.5c.9.3 1.9.6 2.9.7a2 2 0 0 1 1.7 2Z"/></svg>
        06 23 07 52 59
      </div>
      <div class="contact-item">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="1.4"><rect x="2" y="4" width="20" height="16" rx="1.5"/><path d="m22 6-10 7L2 6"/></svg>
        Matheoceleste@gmail.com
      </div>
    </div>

    <div class="site">mathclean.fr</div>
  </div>
</body>
</html>
