<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" font-family="'Segoe UI', Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#eafaff"/>
      <stop offset="1" stop-color="#cdeffd"/>
    </linearGradient>
    <linearGradient id="mane" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f9b14a"/>
      <stop offset="1" stop-color="#e8862b"/>
    </linearGradient>
    <linearGradient id="bubble" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#bfe9ff"/>
    </linearGradient>
    <radialGradient id="face" cx="0.5" cy="0.4" r="0.7">
      <stop offset="0" stop-color="#ffe9c7"/>
      <stop offset="1" stop-color="#f6cd92"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" rx="32" fill="url(#bg)"/>

  <!-- Floating soap bubbles -->
  <g opacity="0.85">
    <circle cx="120" cy="110" r="26" fill="url(#bubble)" stroke="#9ed8f5" stroke-width="2"/>
    <circle cx="112" cy="100" r="6" fill="#ffffff" opacity="0.8"/>
    <circle cx="690" cy="90" r="34" fill="url(#bubble)" stroke="#9ed8f5" stroke-width="2"/>
    <circle cx="678" cy="78" r="8" fill="#ffffff" opacity="0.8"/>
    <circle cx="640" cy="180" r="18" fill="url(#bubble)" stroke="#9ed8f5" stroke-width="2"/>
    <circle cx="700" cy="300" r="22" fill="url(#bubble)" stroke="#9ed8f5" stroke-width="2"/>
    <circle cx="90" cy="280" r="20" fill="url(#bubble)" stroke="#9ed8f5" stroke-width="2"/>
  </g>

  <!-- Lion mascot -->
  <g transform="translate(400 250)">
    <!-- Mane -->
    <g fill="url(#mane)">
      <circle cx="0" cy="0" r="120"/>
      <g>
        <circle cx="0" cy="-128" r="30"/>
        <circle cx="62" cy="-112" r="30"/>
        <circle cx="108" cy="-66" r="30"/>
        <circle cx="128" cy="0" r="30"/>
        <circle cx="108" cy="66" r="30"/>
        <circle cx="62" cy="112" r="30"/>
        <circle cx="0" cy="128" r="30"/>
        <circle cx="-62" cy="112" r="30"/>
        <circle cx="-108" cy="66" r="30"/>
        <circle cx="-128" cy="0" r="30"/>
        <circle cx="-108" cy="-66" r="30"/>
        <circle cx="-62" cy="-112" r="30"/>
      </g>
    </g>

    <!-- Ears -->
    <circle cx="-70" cy="-78" r="24" fill="url(#mane)"/>
    <circle cx="70" cy="-78" r="24" fill="url(#mane)"/>
    <circle cx="-70" cy="-78" r="12" fill="#f0b27a"/>
    <circle cx="70" cy="-78" r="12" fill="#f0b27a"/>

    <!-- Face -->
    <circle cx="0" cy="0" r="92" fill="url(#face)"/>

    <!-- Eyes -->
    <ellipse cx="-34" cy="-14" rx="14" ry="16" fill="#3a2a18"/>
    <ellipse cx="34" cy="-14" rx="14" ry="16" fill="#3a2a18"/>
    <circle cx="-29" cy="-20" r="5" fill="#ffffff"/>
    <circle cx="39" cy="-20" r="5" fill="#ffffff"/>

    <!-- Muzzle -->
    <ellipse cx="0" cy="34" rx="46" ry="34" fill="#fff4e2"/>
    <path d="M -18 22 Q 0 36 18 22 L 0 40 Z" fill="#b5552a"/>
    <path d="M 0 40 Q 0 56 -16 58 M 0 40 Q 0 56 16 58" stroke="#b5552a" stroke-width="4" fill="none" stroke-linecap="round"/>

    <!-- Whisker dots -->
    <g fill="#c98a55">
      <circle cx="-30" cy="34" r="2.5"/>
      <circle cx="-38" cy="44" r="2.5"/>
      <circle cx="30" cy="34" r="2.5"/>
      <circle cx="38" cy="44" r="2.5"/>
    </g>

    <!-- Cleaning sparkle held -->
    <g transform="translate(118 70)">
      <path d="M 0 -16 L 4 -4 L 16 0 L 4 4 L 0 16 L -4 4 L -16 0 L -4 -4 Z" fill="#ffffff" stroke="#7fd0f5" stroke-width="2"/>
    </g>
  </g>

  <!-- Squeegee / brush in paw -->
  <g transform="translate(255 360) rotate(-20)">
    <rect x="-8" y="-90" width="16" height="90" rx="8" fill="#3a8fd0"/>
    <rect x="-34" y="-12" width="68" height="20" rx="6" fill="#2f7ab5"/>
    <rect x="-34" y="6" width="68" height="10" rx="4" fill="#ffd96b"/>
  </g>

  <!-- Brand text -->
  <text x="400" y="448" text-anchor="middle" font-size="52" font-weight="800" fill="#1d6fa5" letter-spacing="1">Math<tspan fill="#e8862b">clean</tspan></text>
  <text x="400" y="478" text-anchor="middle" font-size="20" font-weight="600" fill="#4a6072" letter-spacing="3">PROPRETÉ &amp; CONFIANCE</text>
</svg>
